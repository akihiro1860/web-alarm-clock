<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIONS Alarm Clock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #001240;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      transition: background 0.3s;
      background-image:
        radial-gradient(ellipse at top, #002080 0%, #001240 60%);
    }

    body.ringing {
      animation: flash 0.5s infinite alternate;
    }

    @keyframes flash {
      from { background-color: #001240; }
      to   { background-color: #001a5a; }
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 32px;
    }

    .lions-logo {
      font-size: 2.8rem;
      line-height: 1;
    }

    h1 {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #c8a84b;
      font-weight: 700;
    }

    .team-name {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: #8899cc;
      text-transform: uppercase;
    }

    #clock {
      font-size: clamp(4rem, 16vw, 7rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #f0c040;
      margin-bottom: 8px;
      line-height: 1;
      text-shadow: 0 0 40px rgba(240, 192, 64, 0.3);
    }

    #date {
      font-size: 0.9rem;
      color: #8899cc;
      margin-bottom: 48px;
      letter-spacing: 0.1em;
    }

    .divider {
      width: 100%;
      max-width: 360px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a84b55, transparent);
      margin-bottom: 32px;
    }

    .add-alarm {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
      align-items: center;
    }

    input[type="time"] {
      background: #001a5a;
      border: 1px solid #1a3080;
      color: #ffffff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1.1rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    input[type="time"]:focus {
      border-color: #c8a84b;
      box-shadow: 0 0 0 2px rgba(200, 168, 75, 0.2);
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(2) hue-rotate(5deg);
      cursor: pointer;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      padding: 10px 20px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-add {
      background: linear-gradient(135deg, #c8a84b, #e8c860);
      color: #001240;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .btn-add:hover { opacity: 0.9; }

    #alarm-list {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alarm-item {
      background: #001a5a;
      border: 1px solid #1a3080;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
    }

    .alarm-item.active {
      border-color: #c8a84b;
      box-shadow: 0 0 12px rgba(200, 168, 75, 0.15);
    }

    .alarm-time {
      flex: 1;
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    .alarm-item.active .alarm-time {
      color: #f0c040;
    }

    .alarm-toggle {
      width: 44px;
      height: 24px;
      background: #0d2060;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid #1a3080;
      padding: 0;
    }

    .alarm-toggle::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3a4a80;
      top: 2px;
      left: 2px;
      transition: transform 0.2s, background 0.2s;
    }

    .alarm-toggle.on { background: #1a3a00; border-color: #c8a84b; }
    .alarm-toggle.on::after { transform: translateX(20px); background: #c8a84b; }

    .btn-delete {
      background: transparent;
      color: #3a4a80;
      padding: 4px 8px;
      font-size: 1.1rem;
      border-radius: 6px;
    }

    .btn-delete:hover { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); }

    #ring-banner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 10, 40, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
    }

    #ring-banner.show { display: flex; }

    #ring-banner .ring-lion {
      font-size: 4rem;
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to   { transform: scale(1.15); }
    }

    #ring-banner .ring-label {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c8a84b;
      font-weight: 700;
    }

    #ring-banner .ring-time {
      font-size: clamp(3rem, 14vw, 6rem);
      font-variant-numeric: tabular-nums;
      color: #f0c040;
      letter-spacing: 0.05em;
      text-shadow: 0 0 60px rgba(240, 192, 64, 0.5);
    }

    .btn-stop {
      background: linear-gradient(135deg, #c8a84b, #e8c860);
      color: #001240;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 40px;
      border-radius: 40px;
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    .btn-stop:hover { opacity: 0.9; }

    .empty {
      color: #1a3080;
      font-size: 0.9rem;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="lions-logo">🦁</div>
    <h1>Alarm Clock</h1>
    <div class="team-name">Saitama Seibu Lions</div>
  </div>

  <div id="clock">00:00:00</div>
  <div id="date"></div>
  <div class="divider"></div>

  <div class="add-alarm">
    <input type="time" id="time-input">
    <button class="btn-add" onclick="addAlarm()">+ 追加</button>
  </div>

  <div id="alarm-list"></div>

  <div id="ring-banner">
    <div class="ring-lion">🦁</div>
    <div class="ring-label">アラーム</div>
    <div class="ring-time" id="ring-time"></div>
    <button class="btn-stop" onclick="stopAlarm()">止める</button>
  </div>

  <script>
    const alarms = [];
    let audioCtx = null;
    let ringing = false;
    let beepInterval = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function beep() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    }

    function startRinging(timeStr) {
      if (ringing) return;
      ringing = true;
      document.getElementById('ring-time').textContent = timeStr;
      document.getElementById('ring-banner').classList.add('show');
      document.body.classList.add('ringing');
      beep();
      beepInterval = setInterval(beep, 1000);
    }

    function stopAlarm() {
      ringing = false;
      clearInterval(beepInterval);
      document.getElementById('ring-banner').classList.remove('show');
      document.body.classList.remove('ringing');
    }

    function padZ(n) { return String(n).padStart(2, '0'); }

    function tickClock() {
      const now = new Date();
      const hh = padZ(now.getHours());
      const mm = padZ(now.getMinutes());
      const ss = padZ(now.getSeconds());
      document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;

      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const y = now.getFullYear(), mo = now.getMonth() + 1, d = now.getDate();
      const dow = days[now.getDay()];
      document.getElementById('date').textContent =
        `${y}年${mo}月${d}日（${dow}）`;

      if (!ringing) {
        const currentTime = `${hh}:${mm}`;
        alarms.forEach(a => {
          if (a.on && a.time === currentTime && ss === '00') {
            startRinging(a.time);
          }
        });
      }
    }

    function renderAlarms() {
      const list = document.getElementById('alarm-list');
      if (alarms.length === 0) {
        list.innerHTML = '<p class="empty">アラームが設定されていません</p>';
        return;
      }
      list.innerHTML = alarms.map((a, i) => `
        <div class="alarm-item ${a.on ? 'active' : ''}">
          <span class="alarm-time">${a.time}</span>
          <button class="alarm-toggle ${a.on ? 'on' : ''}" onclick="toggleAlarm(${i})" title="${a.on ? 'オフ' : 'オン'}"></button>
          <button class="btn-delete" onclick="deleteAlarm(${i})" title="削除">✕</button>
        </div>
      `).join('');
    }

    function addAlarm() {
      const input = document.getElementById('time-input');
      const val = input.value;
      if (!val) return;
      if (alarms.some(a => a.time === val)) return;
      alarms.push({ time: val, on: true });
      alarms.sort((a, b) => a.time.localeCompare(b.time));
      renderAlarms();
      input.value = '';
    }

    function toggleAlarm(i) {
      alarms[i].on = !alarms[i].on;
      renderAlarms();
    }

    function deleteAlarm(i) {
      alarms.splice(i, 1);
      renderAlarms();
    }

    document.getElementById('time-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addAlarm();
    });

    renderAlarms();
    tickClock();
    setInterval(tickClock, 1000);
  </script>
</body>
</html>
